<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spillway</title>
    <meta name="description" content="Who pays when a liquidation cascade drains a perp exchange's insurance fund." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">Spillway</div>
        <div class="market" id="market"></div>
      </header>
      <p class="headline" id="headline"></p>
      <section class="stage" id="stage" aria-label="The flood picture">
        <div class="canvas" id="canvas"></div>
        <div class="overlay" id="overlay"></div>
      </section>
      <p class="sentence" id="sentence"></p>
      <section class="controls">
        <div class="scenario" id="scenario" role="group" aria-label="Open interest">
          <span>Open interest</span>
          <button data-k="1" aria-pressed="true">Today</button>
          <button data-k="3" aria-pressed="false">3x</button>
          <button data-k="10" aria-pressed="false">10x</button>
        </div>
        <label class="slider" for="drop">
          <span class="slider-label">Price gap while liquidations are paused <b id="drop-value">0%</b></span>
          <input type="range" id="drop" min="0" max="40" step="0.5" value="0" />
        </label>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
